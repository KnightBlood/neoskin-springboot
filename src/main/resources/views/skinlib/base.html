<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content, beforeFoot)"
      th:lang="${locale}">
<head>
  <th:block th:replace="~{shared/head :: shared-head}"></th:block>
  <title th:text="|${title} - ${site_name}|"></title>
</head>

<body th:classappend="${dark_mode ? 'dark-mode' : ''}" class="hold-transition layout-top-nav">
  <div class="wrapper">
    <nav class="main-header navbar navbar-expand ml-0"
         th:classappend="|navbar-${navbar_color} navbar-${color_mode}|">
      <div class="container">
        <div class="navbar-header">
          <a th:href="${view.url('/')}" class="navbar-brand" th:text="${site_name}"></a>
        </div>

        <div class="collapse navbar-collapse">
          <ul class="nav navbar-nav">
            <li class="nav-item active">
              <a class="nav-link" th:href="${view.url('skinlib')}"
                 th:text="${view.trans('general.skinlib')}"></a>
            </li>
            <li class="nav-item" th:if="${view.authCheck()}">
              <a class="nav-link" th:href="${view.url('user/closet')}"
                 th:text="${view.trans('general.my-closet')}"></a>
            </li>
          </ul>
        </div>

        <div class="navbar-custom-menu">
          <ul class="nav navbar-nav">
            <li class="nav-item" th:if="${view.authCheck()}">
              <a class="nav-link" th:href="${view.url('skinlib/upload')}">
                <i class="fas fa-upload" aria-hidden="true"></i>&nbsp;
                <span class="d-none d-sm-inline"
                      th:text="${view.trans('skinlib.general.upload-new-skin')}"></span>
              </a>
            </li>
            <th:block th:if="${view.authCheck()}">
              <th:block th:replace="~{shared/notifications :: shared-notifications}"></th:block>
            </th:block>
            <th:block th:replace="~{shared/languages :: shared-languages}"></th:block>
            <th:block th:if="${view.authCheck()}">
              <th:block th:replace="~{shared/user-menu :: shared-user-menu}"></th:block>
            </th:block>
            <li class="nav-item" th:unless="${view.authCheck()}">
              <a class="nav-link" th:href="${view.url('auth/login')}">
                <i class="fas fa-user"></i>
                <span class="d-none d-sm-inline" th:text="${view.trans('general.anonymous')}"></span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <th:block th:replace="${content}"></th:block>

    <footer class="main-footer">
      <div class="container">
        <th:block th:replace="~{shared/copyright :: shared-copyright}"></th:block>
      </div>
    </footer>
  </div>
  <th:block th:replace="${beforeFoot}"></th:block>
  <th:block th:replace="~{shared/foot :: shared-foot}"></th:block>
</body>
</html>
