<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="widget">
  <div class="card card-primary card-outline">
    <div class="card-header">
      <h3 class="card-title" th:text="${view.trans('user.announcement')}"></h3>
      <th:block th:if="${view.authCheck() and view.authUser().isAdmin()}">
        &nbsp;
        <a aria-label="编辑站点公告" title="编辑站点公告"
           th:href="${view.url('admin/communications?announcement=1')}">
          <i class="fas fa-edit"></i>
        </a>
      </th:block>
    </div>
    <div class="card-body" th:utext="${announcement}"></div>
  </div>
</th:block>
</body>
</html>
