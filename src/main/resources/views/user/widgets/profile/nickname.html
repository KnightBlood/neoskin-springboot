<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="widget">
  <form class="card card-primary" method="post" id="change-nickname">
    <div class="card-header">
      <h3 class="card-title" th:text="${view.trans('user.profile.nickname.title')}"></h3>
    </div>
    <div class="card-body">
      <div class="form-group">
        <input type="text" class="form-control" name="nickname" required
               th:value="${user_nickname}">
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" type="submit"
              th:text="${view.trans('general.submit')}"></button>
    </div>
  </form>
</th:block>
</body>
</html>
