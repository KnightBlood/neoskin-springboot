<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="widget">
  <form class="card card-warning" method="post" id="change-password">
    <div class="card-header">
      <h3 class="card-title" th:text="${view.trans('user.profile.password.title')}"></h3>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label th:text="${view.trans('user.profile.password.old')}"></label>
        <input type="password" class="form-control" name="oldPassword"
               required autocomplete="current-password">
      </div>

      <div class="form-group">
        <label th:text="${view.trans('user.profile.password.new')}"></label>
        <input type="password" class="form-control" name="newPassword" required
               minlength="8" maxlength="32" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label th:text="${view.trans('user.profile.password.confirm')}"></label>
        <input type="password" class="form-control" name="confirm" required
               minlength="8" maxlength="32" autocomplete="new-password">
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" type="submit"
              th:text="${view.trans('user.profile.password.button')}"></button>
    </div>
  </form>
</th:block>
</body>
</html>
