<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="widget">
  <form class="card card-warning" method="post" id="change-email">
    <div class="card-header">
      <h3 class="card-title" th:text="${view.trans('user.profile.email.title')}"></h3>
    </div>
    <div class="card-body">
      <div class="form-group">
        <input type="email" class="form-control" name="email" required
               th:value="${user_email}"
               th:placeholder="${view.trans('user.profile.email.new')}">
      </div>
      <div class="form-group">
        <input type="password" class="form-control" name="password" required
               th:placeholder="${view.trans('user.profile.email.password')}"
               autocomplete="current-password">
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" type="submit"
              th:text="${view.trans('user.profile.email.button')}"></button>
    </div>
  </form>
</th:block>
</body>
</html>
