<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/base :: page(${pageTitle}, ~{::content}, ~{::before-foot})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{shared/grid :: grid(${gridRows})}"></th:block>

  <div id="modal-score-instruction" class="modal fade" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" th:text="${view.trans('user.score-intro.title')}"></h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <th:block th:utext="${score_intro_html}"></th:block>
          <hr />
          <div class="row">
            <div class="col-md-4" th:each="rate : ${rates}">
              <p class="text-center"
                 th:text="${view.trans('user.score-intro.rates.' + rate.key, 'score', rate.value)}"></p>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default" data-dismiss="modal"
                  th:text="${view.trans('general.close')}"></button>
        </div>
      </div>
    </div>
  </div>
</th:block>

<th:block th:fragment="before-foot">
  <script id="blessing-extra" type="application/json" th:utext="${extra_json}"></script>
</th:block>
</body>
</html>
