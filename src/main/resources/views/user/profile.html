<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/base :: page(${pageTitle}, ~{::content}, ~{::before-foot})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{shared/grid :: grid(${gridRows})}"></th:block>

  <form id="modal-delete-account" class="modal fade" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content bg-danger">
        <div class="modal-header">
          <h5 class="modal-title" th:text="${view.trans('user.profile.delete.modal-title')}"></h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div th:utext="${view.trans('user.profile.delete.modal-notice')}"></div>
          <br>
          <input type="password" class="form-control" required name="password"
                 th:placeholder="${view.trans('user.profile.delete.password')}" autocomplete="current-password">
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" class="btn btn-outline-light" data-dismiss="modal"
                  th:text="${view.trans('general.close')}"></button>
          <button type="submit" class="btn btn-outline-light"
                  th:text="${view.trans('general.submit')}"></button>
        </div>
      </div>
    </div>
  </form>
</th:block>
<th:block th:fragment="before-foot"></th:block>
</body>
</html>
