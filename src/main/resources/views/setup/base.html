<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)" th:lang="${locale}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title th:text="${title}"></title>
  <link th:href="|${cdn_base}/app/spectre.e885dd0.css|" rel="stylesheet" crossorigin="anonymous">
</head>

<body class="bg-secondary">
  <th:block th:replace="~{errors/languages :: menu}"></th:block>
  <div class="hero d-flex">
    <div class="hero-body">
      <h1 class="text-center">
        <a class="text-primary" href="https://github.com/bs-community/blessing-skin-server">
          Blessing Skin Server
        </a>
      </h1>
      <div class="divider"></div>
      <h3 th:text="${title}"></h3>
      <div class="divider"></div>
      <th:block th:replace="${content}"></th:block>
    </div>
  </div>
</body>
</html>
