<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{setup/base :: page(${view.trans('setup.wizard.database.title')}, ~{::content})}">
<body>
<th:block th:fragment="content">
  <p th:text="${view.trans('setup.wizard.database.text')}"></p>
  <form id="setup" method="post" th:action="${view.url('setup/database')}"
        novalidate="novalidate">
    <th:block th:utext="${view.csrfField()}"></th:block>
    <table>
      <tr>
        <th><label for="type" class="form-label"
                   th:text="${view.trans('setup.wizard.database.type')}"></label></th>
        <td class="form-group">
          <label class="form-radio d-inline-block">
            <input name="type" type="radio" value="mysql" id="type-mysql" checked>
            <i class="form-icon"></i> MySQL / MariaDB
          </label>
          <label class="form-radio d-inline-block">
            <input name="type" type="radio" value="pgsql" id="type-pgsql">
            <i class="form-icon"></i> PostgreSQL
          </label>
          <label class="form-radio d-inline-block">
            <input name="type" type="radio" value="sqlite" id="type-sqlite">
            <i class="form-icon"></i> SQLite
          </label>
        </td>
      </tr>
      <tr>
        <th><label class="form-label" for="host"
                   th:text="${view.trans('setup.wizard.database.host')}"></label></th>
        <td><input class="form-input" name="host" type="text" id="host" size="25"
                   th:value="${host}"></td>
      </tr>
      <tr>
        <th><label class="form-label" for="port"
                   th:text="${view.trans('setup.wizard.database.port')}"></label></th>
        <td><input class="form-input" name="port" type="text" id="port" size="25"
                   th:value="${port}"></td>
      </tr>
      <tr>
        <th><label class="form-label" for="username"
                   th:text="${view.trans('setup.wizard.database.username')}"></label></th>
        <td><input class="form-input" name="username" type="text" id="username" size="25"
                   th:value="${username}"></td>
      </tr>
      <tr>
        <th><label class="form-label" for="password"
                   th:text="${view.trans('setup.wizard.database.password')}"></label></th>
        <td><input class="form-input" type="password" name="password" id="password"
                   th:value="${password}"></td>
      </tr>
      <tr>
        <th><label class="form-label" for="db"
                   th:text="${view.trans('setup.wizard.database.db')}"></label></th>
        <td><input class="form-input" name="db" type="text" id="db" size="25"
                   th:value="${database}"></td>
      </tr>
      <tr>
        <th></th>
        <td><p><small th:text="${view.trans('setup.wizard.database.db-notice')}"></small></p></td>
      </tr>
      <tr>
        <th><label class="form-label" for="prefix"
                   th:text="${view.trans('setup.wizard.database.prefix')}"></label></th>
        <td><input class="form-input" name="prefix" type="text" id="prefix" size="25"
                   th:value="${prefix}"></td>
      </tr>
      <tr>
        <th></th>
        <td><p><small th:text="${view.trans('setup.wizard.database.prefix-notice')}"></small></p></td>
      </tr>
    </table>

    <div th:if="${errors.any()}" class="toast toast-error" role="alert">
      <ul>
        <li th:each="error : ${errors.all()}" th:text="${error}"></li>
      </ul>
    </div>

    <p class="step">
      <input type="submit" name="submit" id="submit" class="btn btn-primary"
             th:value="${view.trans('setup.wizard.welcome.button')}">
    </p>
  </form>
</th:block>
</body>
</html>
