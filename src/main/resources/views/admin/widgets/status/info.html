<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="widget">
  <div class="card card-info">
    <div class="card-header">
      <h3 class="card-title" th:text="${view.trans('admin.status.info')}"></h3>
    </div>
    <div class="card-body">
      <table class="table table-bordered table-striped">
        <tbody>
          <th:block th:each="category : ${detail}">
            <tr>
              <th colspan="2" th:text="${view.trans('admin.status.' + category.key + '.name')}"></th>
            </tr>
            <tr th:each="item : ${category.value}">
              <td th:text="${view.trans('admin.status.' + category.key + '.' + item.key)}"></td>
              <td th:text="${item.value}"></td>
            </tr>
          </th:block>
        </tbody>
      </table>
    </div>
  </div>
</th:block>
</body>
</html>
