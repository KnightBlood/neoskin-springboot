<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page" th:lang="${locale}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="|${title} - ${site_name}|"></title>
    <link th:href="${assets['spectre']}" rel="stylesheet" crossorigin="anonymous">
    <th:block th:each="style : ${styles}">
      <link rel="stylesheet" th:href="${style}">
    </th:block>
  </head>

  <body class="bg-gray">
    <th:block th:replace="~{errors/languages :: menu}"></th:block>
    <div class="hero d-flex">
      <div class="hero-body text-center">
        <h1><a class="text-primary" th:href="${view.url('/')}" th:text="${site_name}"></a></h1>
        <div class="divider"></div>
        <h3 style="margin-top: 15vh;" th:text="${subtitle}"></h3>
        <!--
          message：各状态码模板的 {% block message %}。内容是<b>已排版好</b>的 HTML
          （见 ErrorPages），逐字对齐源输出，所以这里用 utext 而不是 text。
          转义在 Java 侧按 PHP 的 htmlspecialchars 规则做（PhpHtml.escape）。
        -->
        <th:block th:utext="${message}"></th:block>
        <div class="divider"></div>
        <!--
          {% if auth_user() and auth_user().isAdmin() %}：只给管理员看 FAQ 链接。
          authUser() 在匿名时返回 null，Thymeleaf 的 and 是短路的，不会 NPE。
        -->
        <th:block th:if="${view.authUser() != null and view.authUser().isAdmin()}">
          <a class="btn btn-link" href="https://blessing.netlify.com/faq.html" target="_blank">FAQ</a>
        </th:block>
      </div>
    </div>
    <th:block th:each="script : ${scripts}">
      <script th:src="${script}"></script>
    </th:block>
  </body>
</html>
