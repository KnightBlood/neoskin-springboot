<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}">
<head>
  <th:block th:replace="~{shared/head :: shared-head}"></th:block>
  <link rel="preload" as="image" th:href="${home_pic_url}">
  <title th:text="${site_name}"></title>
  <style>
    .hp-wrapper {
      <th:block th:if="${fixed_bg}">background-color: rgba(0, 0, 0, 0);</th:block>
      <th:block th:unless="${fixed_bg}" th:text="|background-image: url('${home_pic_url}');|"></th:block>
    }
  </style>
  <link rel="stylesheet" th:href="${assets['home_css']}" crossorigin="anonymous">
</head>

<body class="hold-transition layout-top-nav">
  <div class="hp-wrapper">
    <div th:if="${fixed_bg}" id="fixed-bg"
         th:style="|background-image: url('${home_pic_url}')|"></div>

    <nav class="navbar navbar-expand fixed-top"
         th:classappend="|navbar-${navbar_color} navbar-${color_mode} ml-0${transparent_navbar ? ' transparent' : ''}|">
      <div class="container">
        <div class="navbar-header">
          <a th:href="${view.url('/')}" class="navbar-brand" th:text="${site_name}"></a>
        </div>

        <div class="navbar-custom-menu">
          <ul class="nav navbar-nav">
            <li class="nav-item">
              <a class="nav-link" th:href="${view.url('skinlib')}" th:text="${view.trans('general.skinlib')}"></a>
            </li>

            <th:block th:replace="~{shared/languages :: shared-languages}"></th:block>

            <th:block th:if="${view.authCheck()}">
              <th:block th:replace="~{shared/user-menu :: shared-user-menu}"></th:block>
            </th:block>
            <li th:unless="${view.authCheck()}" class="nav-item">
              <a class="nav-link" th:href="${view.url('auth/login')}">
                <i class="icon fas fa-sign-in-alt"></i>
                <th:block th:text="${view.trans('general.login')}"></th:block>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="splash">
        <h1 class="splash-head" th:text="${site_name}"></h1>
        <p class="splash-subhead" th:text="${site_description}"></p>
        <p>
          <a th:if="${view.authCheck()}" th:href="${view.url('user')}" class="main-button"
             th:text="${view.trans('general.user-center')}"></a>
          <a th:unless="${view.authCheck()}" th:href="${view.url('auth/register')}" class="main-button"
             th:text="${view.trans('general.register')}"></a>
        </p>
      </div>
    </div>

    <div th:if="${hide_intro}" id="copyright" class="without-intro">
      <div class="container">
        <th:block th:replace="~{shared/copyright :: shared-copyright}"></th:block>
      </div>
    </div>
  </div>

  <th:block th:unless="${hide_intro}">
    <div id="intro">
      <div class="container">
        <div class="text-center">
          <h1 th:text="${view.trans('index.features.title')}"></h1>
          <br>
          <br>
          <div class="container-lg">
            <div class="row">
              <div class="col-lg" th:each="item : ${featureItems}">
                <i th:class="|fas ${view.trans('index.features.' + item + '.icon')} mb-3|"
                   aria-hidden="true"></i>
                <h3 th:text="${view.trans('index.features.' + item + '.name')}"></h3>
                <p th:utext="${view.trans('index.features.' + item + '.desc')}"></p>
              </div>
            </div>
          </div>
        </div>
        <br>
      </div>
    </div>
    <div id="footer-wrap">
      <div class="container">
        <div class="row">
          <div class="col-lg-6 mb-2" th:text="${intro}"></div>
          <div class="col-lg-4"></div>
          <div class="col-lg-2 d-flex justify-content-center align-items-center">
            <a th:href="${view.url('auth/register')}" class="main-button"
               th:text="${view.trans('index.start')}"></a>
          </div>
        </div>
      </div>
    </div>
    <div id="copyright" class="with-intro">
      <div class="container">
        <th:block th:replace="~{shared/copyright :: shared-copyright}"></th:block>
      </div>
    </div>
  </th:block>

  <script type="application/json" id="blessing-extra" th:utext="${blessingExtra}"></script>
  <script th:src="${assets['home']}" crossorigin="anonymous"></script>
  <th:block th:replace="~{shared/foot :: shared-foot}"></th:block>
</body>
</html>
