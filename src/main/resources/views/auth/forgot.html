<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/base :: page(~{::content}, ~{::before-foot})}">
<body>
<th:block th:fragment="content">
  <p class="login-box-msg" th:text="${view.trans('auth.forgot.message')}"></p>
  <th:block th:if="${view.sessionHas('msg')}">
    <div class="alert alert-warning" th:text="${view.sessionPull('msg')}"></div>
  </th:block>
  <main></main>
</th:block>

<th:block th:fragment="before-foot">
  <script id="blessing-extra" type="application/json" th:utext="${extra}"></script>
</th:block>
</body>
</html>
