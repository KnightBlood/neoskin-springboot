name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  FRONTEND_URL: "https://github.com/DreamCraft-Tech/blessing-skin-server-patch/releases/download/v6.0.10_patch/blessing-skin-server_6.0.10_patch_php85.zip"
  FRONTEND_SHA256: "bb94f83718f3fca3737a04b2097e747720ebd5966979cf042dbbba5434da3e73"

jobs:
  package:
    name: Build JAR bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Resolve version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch legacy frontend assets
        run: |
          set -euo pipefail
          curl -sSLo /tmp/bs.zip "$FRONTEND_URL"
          echo "$FRONTEND_SHA256  /tmp/bs.zip" | sha256sum -c -
          unzip -q /tmp/bs.zip -d /tmp/bs
          mkdir -p frontend/public
          rm -rf frontend/public/app
          cp -r /tmp/bs/public/app frontend/public/app

      - name: Build
        run: mvn -B -ntp -DskipTests package "-Dfrontend.app.dir=frontend/public/app"

      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p stage/public dist
          cp target/neoskin-springboot-*.jar stage/neoskin.jar
          cp -r public/app-next stage/public/app-next
          cp .env.example DEPLOYMENT.md README.md stage/
          (cd stage && zip -r "../dist/neoskin-springboot_${VERSION}.zip" .)
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: neoskin-springboot
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: neoskin-springboot
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
