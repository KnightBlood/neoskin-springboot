name: CI — DB matrix
# 对 AGENTS.md 验证清单的持久化：5 种数据库各自的 mvn clean verify。
# SQL Server 本机无法免安装运行（需要装服务），统一放在这里用官方镜像验证。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # 前端预编译产物（public/app）不提交到本仓库。源仓库 KnightBlood/blessing-skin-server-Laravel13
  # 的发布包里有 public/app，但发布包可能落后于 main；这里按它 CI 的做法（build-php85.py）
  # 直接 `yarn install --frozen-lockfile && yarn build` 构建一次，供 5 个 DB 矩阵共用。
  frontend:
    name: Build frontend (public/app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KnightBlood/blessing-skin-server-Laravel13
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and build
        working-directory: frontend
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
          yarn build

      # 与源仓库 tools/build-php85.py 一致：webpack 之外还有 3 个静态文件要放进 public/app
      - name: Copy non-webpack assets
        run: |
          cp frontend/resources/assets/src/images/bg.webp        frontend/public/app/
          cp frontend/resources/assets/src/images/favicon.ico    frontend/public/app/
          cp frontend/resources/assets/standalone/*.js           frontend/public/app/

      - name: Check artifacts
        run: |
          test -f frontend/public/app/app.twig \
            || { echo "public/app/app.twig missing after yarn build"; exit 1; }
          test -f frontend/public/app/style.twig \
            || { echo "public/app/style.twig missing after yarn build"; exit 1; }
          test -f frontend/public/app/favicon.ico \
            || { echo "public/app/favicon.ico missing"; exit 1; }
          echo "frontend files: $(find frontend/public/app -type f | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: frontend/public/app
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [ sqlite, mysql, mariadb, pgsql, sqlsrv ]

    env:
      # SQLite: 矩阵值已是合法的 DB_CONNECTION；mvn 里项目默认是 mysql，显式固定。
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_DATABASE: blessingskin
      MAVEN_ARGS: -B -ntp

    steps:
      - uses: actions/checkout@v4

      # 前端产物由上面的 frontend job 构建并上传，这里只下载。
      - uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: frontend/public/app

      - name: Check frontend artifacts
        run: |
          test -f "$GITHUB_WORKSPACE/frontend/public/app/app.twig" \
            || { echo "public/app missing in downloaded artifact"; exit 1; }
          echo "frontend files: $(find "$GITHUB_WORKSPACE/frontend/public/app" -type f | wc -l)"
        shell: bash

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('pom.xml') }}
          restore-keys: m2-

      # ------------------------------------------------ MySql / MariaDB ----
      - name: Start MySQL
        if: matrix.database == 'mysql'
        run: |
          docker run -d --name neoskin-db \
            -e MYSQL_ROOT_PASSWORD=123456 \
            -e MYSQL_DATABASE=blessingskin \
            -e MYSQL_USER=blessing -e MYSQL_PASSWORD=123456 \
            -p 3306:3306 mysql:8 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 60); do
            docker exec neoskin-db mysqladmin --protocol=tcp -h 127.0.0.1 \
              -u root --password=123456 ping && break
            sleep 2
          done
        shell: bash

      - name: Start MariaDB
        if: matrix.database == 'mariadb'
        run: |
          docker run -d --name neoskin-db \
            -e MARIADB_ROOT_PASSWORD=123456 \
            -e MARIADB_DATABASE=blessingskin \
            -e MARIADB_USER=blessing -e MARIADB_PASSWORD=123456 \
            -p 3306:3306 mariadb:11 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 60); do
            docker exec neoskin-db mariadb-admin --protocol=tcp -h 127.0.0.1 \
              -u root --password=123456 ping && break
            sleep 2
          done
        shell: bash

      # ---------------------------------------------------- PostgreSQL ----
      - name: Start PostgreSQL
        if: matrix.database == 'pgsql'
        run: |
          docker run -d --name neoskin-db \
            -e POSTGRES_PASSWORD=123456 \
            -e POSTGRES_DB=blessingskin \
            -p 5432:5432 postgres:16
          for i in $(seq 1 60); do
            docker exec neoskin-db pg_isready -U postgres && break
            sleep 2
          done
        shell: bash

      # ----------------------------------------------------- SQL Server ----
      # SA 密码必须满足复杂度（镜像在启动时强制），统一 123456 的密码留给
      # 下面 sqlcmd 建出来的业务登录 blessing —— 应用侧凭据依然全矩阵一致。
      - name: Start SQL Server
        if: matrix.database == 'sqlsrv'
        env:
          SA_BOOTSTRAP_PASSWORD: 'Bootstrap_SA!2026'
          APP_SA_PASSWORD: '123456'
        run: |
          docker run -d --name neoskin-db \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$SA_BOOTSTRAP_PASSWORD" \
            -e MSSQL_PID=Developer \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 90); do
            docker exec neoskin-db /opt/mssql-tools18/bin/sqlcmd \
              -C -S localhost -U sa -P "$SA_BOOTSTRAP_PASSWORD" \
              -Q 'SELECT 1' -l 1 && break
            sleep 2
          done
          docker exec neoskin-db /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa -P "$SA_BOOTSTRAP_PASSWORD" \
            -Q "CREATE DATABASE blessingskin;
                CREATE LOGIN blessing WITH PASSWORD = '$APP_SA_PASSWORD', CHECK_POLICY = OFF;
                ALTER SERVER ROLE sysadmin ADD MEMBER blessing;"
          echo "DB_PORT=1433"           >> "$GITHUB_ENV"
          echo "DB_USERNAME=blessing"   >> "$GITHUB_ENV"
          echo "DB_PASSWORD=123456"     >> "$GITHUB_ENV"
          echo "DB_ENCRYPT=false"       >> "$GITHUB_ENV"
          echo "DB_TRUST_SERVER_CERTIFICATE=true" >> "$GITHUB_ENV"
        shell: bash

      - name: Configure non-SQL-Server credentials
        if: matrix.database != 'sqlsrv'
        run: |
          case "${{ matrix.database }}" in
            mysql)
              echo "DB_PORT=3306"         >> "$GITHUB_ENV"
              echo "DB_USERNAME=blessing" >> "$GITHUB_ENV"
              echo "DB_PASSWORD=123456"   >> "$GITHUB_ENV" ;;
            mariadb)
              echo "DB_PORT=3306"         >> "$GITHUB_ENV"
              echo "DB_USERNAME=blessing" >> "$GITHUB_ENV"
              echo "DB_PASSWORD=123456"   >> "$GITHUB_ENV" ;;
            pgsql)
              echo "DB_PORT=5432"         >> "$GITHUB_ENV"
              echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"
              echo "DB_PASSWORD=123456"   >> "$GITHUB_ENV" ;;
            sqlite)
              echo "DB_PORT="             >> "$GITHUB_ENV"
              echo "DB_USERNAME="         >> "$GITHUB_ENV"
              echo "DB_PASSWORD="         >> "$GITHUB_ENV" ;;
          esac
        shell: bash

      - name: mvn clean verify
        run: mvn clean verify -Dfrontend.app.dir="$GITHUB_WORKSPACE/frontend/public/app"
        shell: bash
