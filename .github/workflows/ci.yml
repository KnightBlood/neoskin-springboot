name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  MAVEN_OPTS: "-XX:+EnableDynamicAgentLoading -Djava.awt.headless=true"
  FRONTEND_REF: "v6.0.10_patch"

jobs:
  frontend:
    name: Frontend assets (public/app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch legacy frontend assets
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FRONTEND_REF" https://github.com/DreamCraft-Tech/blessing-skin-server-patch.git /tmp/bs-src
          corepack enable
          (cd /tmp/bs-src && yarn install --frozen-lockfile && yarn build)
          mkdir -p frontend/public
          rm -rf frontend/public/app
          cp -r /tmp/bs-src/public/app frontend/public/app
          test -f frontend/public/app/app.twig
          echo "frontend files: $(find frontend/public/app -type f | wc -l)"

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-app
          path: frontend/public/app
          if-no-files-found: error
          retention-days: 7

  platform-package:
    name: Platform package (${{ matrix.os }} / ${{ matrix.arch }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-latest, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-app
          path: frontend/public/app
      - if: matrix.os != 'windows-11-arm'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: echo "JAVA_HOME=$env:JAVA_HOME_21_AARCH64" >> $env:GITHUB_ENV
      - run: mvn -B -ntp -DskipTests package "-Dfrontend.app.dir=frontend/public/app"

  platform-test:
    name: Platform test (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04-arm, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-app
          path: frontend/public/app
      - if: matrix.os != 'windows-11-arm'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: echo "JAVA_HOME=$env:JAVA_HOME_21_AARCH64" >> $env:GITHUB_ENV
      - run: mvn -B -ntp test "-Dfrontend.app.dir=frontend/public/app"

  verify:
    name: Verify (${{ matrix.database }})
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [ sqlite, mysql, mariadb, pgsql, sqlsrv ]

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_DATABASE: blessingskin
      MAVEN_ARGS: -B -ntp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: frontend-app
          path: frontend/public/app

      - name: Check frontend artifacts
        run: |
          test -f "$GITHUB_WORKSPACE/frontend/public/app/app.twig" \
            || { echo "public/app missing in downloaded artifact"; exit 1; }
          echo "frontend files: $(find "$GITHUB_WORKSPACE/frontend/public/app" -type f | wc -l)"
        shell: bash

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # ------------------------------------------------ MySql / MariaDB ----
      - name: Start MySQL
        if: matrix.database == 'mysql'
        run: |
          docker run -d --name neoskin-db \
            -e MYSQL_ROOT_PASSWORD=123456 \
            -e MYSQL_DATABASE=blessingskin \
            -e MYSQL_USER=blessing -e MYSQL_PASSWORD=123456 \
            -p 3306:3306 mysql:8.4 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 60); do
            docker exec neoskin-db mysqladmin --protocol=tcp -h 127.0.0.1 \
              -u root --password=123456 ping && break
            sleep 2
          done
        shell: bash

      - name: Start MariaDB
        if: matrix.database == 'mariadb'
        run: |
          docker run -d --name neoskin-db \
            -e MARIADB_ROOT_PASSWORD=123456 \
            -e MARIADB_DATABASE=blessingskin \
            -e MARIADB_USER=blessing -e MARIADB_PASSWORD=123456 \
            -p 3306:3306 mariadb:11.8 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 60); do
            docker exec neoskin-db mariadb-admin --protocol=tcp -h 127.0.0.1 \
              -u root --password=123456 ping && break
            sleep 2
          done
        shell: bash

      # ---------------------------------------------------- PostgreSQL ----
      - name: Start PostgreSQL
        if: matrix.database == 'pgsql'
        run: |
          docker run -d --name neoskin-db \
            -e POSTGRES_PASSWORD=123456 \
            -e POSTGRES_DB=blessingskin \
            -p 5432:5432 postgres:18
          for i in $(seq 1 60); do
            docker exec neoskin-db pg_isready -U postgres && break
            sleep 2
          done
        shell: bash

      # ----------------------------------------------------- SQL Server ----
      - name: Start SQL Server
        if: matrix.database == 'sqlsrv'
        env:
          SA_BOOTSTRAP_PASSWORD: 'Bootstrap_SA!2026'
          APP_SA_PASSWORD: '123456'
        run: |
          docker run -d --name neoskin-db \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$SA_BOOTSTRAP_PASSWORD" \
            -e MSSQL_PID=Developer \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2025-latest
          for i in $(seq 1 90); do
            docker exec neoskin-db /opt/mssql-tools18/bin/sqlcmd \
              -C -S localhost -U sa -P "$SA_BOOTSTRAP_PASSWORD" \
              -Q 'SELECT 1' -l 1 && break
            sleep 2
          done
          docker exec neoskin-db /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa -P "$SA_BOOTSTRAP_PASSWORD" \
            -Q "CREATE DATABASE blessingskin;
                CREATE LOGIN blessing WITH PASSWORD = '$APP_SA_PASSWORD', CHECK_POLICY = OFF;
                ALTER SERVER ROLE sysadmin ADD MEMBER blessing;"
          echo "DB_PORT=1433"           >> "$GITHUB_ENV"
          echo "DB_USERNAME=blessing"   >> "$GITHUB_ENV"
          echo "DB_PASSWORD=123456"     >> "$GITHUB_ENV"
          echo "DB_ENCRYPT=false"       >> "$GITHUB_ENV"
          echo "DB_TRUST_SERVER_CERTIFICATE=true" >> "$GITHUB_ENV"
        shell: bash

      - name: Configure non-SQL-Server credentials
        if: matrix.database != 'sqlsrv'
        run: |
          case "${{ matrix.database }}" in
            mysql)
              echo "DB_PORT=3306"         >> "$GITHUB_ENV"
              echo "DB_USERNAME=blessing" >> "$GITHUB_ENV"
              echo "DB_PASSWORD=123456"   >> "$GITHUB_ENV" ;;
            mariadb)
              echo "DB_PORT=3306"         >> "$GITHUB_ENV"
              echo "DB_USERNAME=blessing" >> "$GITHUB_ENV"
              echo "DB_PASSWORD=123456"   >> "$GITHUB_ENV" ;;
            pgsql)
              echo "DB_PORT=5432"         >> "$GITHUB_ENV"
              echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"
              echo "DB_PASSWORD=123456"   >> "$GITHUB_ENV" ;;
            sqlite)
              echo "DB_PORT="             >> "$GITHUB_ENV"
              echo "DB_USERNAME="         >> "$GITHUB_ENV"
              echo "DB_PASSWORD="         >> "$GITHUB_ENV" ;;
          esac
        shell: bash

      - name: mvn clean verify
        run: |
          set -o pipefail
          mvn clean verify -Dfrontend.app.dir="$GITHUB_WORKSPACE/frontend/public/app" \
            2>&1 | tee "/tmp/mvn-${{ matrix.database }}.log"
        shell: bash

  browser-e2e:
    name: Browser E2E (Playwright)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: frontend-app
          path: frontend/public/app

      - name: Install browser test deps
        run: npm ci --prefix tests/browser

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Export Chrome path
        run: echo "NEOSKIN_CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Browser E2E
        env:
          NEOSKIN_BROWSER_E2E: "1"
          DB_CONNECTION: sqlite
        run: mvn -B -ntp -Dtest=BrowserE2ETest -Dfrontend.app.dir="$GITHUB_WORKSPACE/frontend/public/app" test
